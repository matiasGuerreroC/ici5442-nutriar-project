<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NutriAR Scanner</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #camera-feed { width: 100%; height: 100%; object-fit: cover; }
        
        /* Capa de Realidad Aumentada (HUD) */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            pointer-events: none;
        }

        .scan-frame {
            width: 80%; height: 40%; border: 2px solid rgba(255, 255, 255, 0.5);
            margin-top: 20%; border-radius: 20px; position: relative;
            box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.5);
        }

        /* Cartel de Alerta (Se activa con JS) */
        #ar-card {
            background: rgba(220, 20, 60, 0.95);
            color: white; width: 85%; padding: 20px; border-radius: 15px;
            text-align: center; transform: translateY(100px);
            opacity: 0; transition: all 0.5s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            pointer-events: auto;
        }

        #ar-card.visible { opacity: 1; transform: translateY(-50px); }

        .btn-scan {
            pointer-events: auto; background: #2ecc71; color: white;
            border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 18px; font-weight: bold; margin-bottom: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <video id="camera-feed" autoplay playsinline></video>

    <div class="overlay">
        <div class="scan-frame"></div>
        
        <div id="ar-card">
            <h2 style="margin:0">⚠️ ALERTA NUTRIAR</h2>
            <p id="risk-text">Analizando producto...</p>
            <small>Basado en tu perfil: <b>Celíaco</b></small>
        </div>

        <button class="btn-scan" onclick="startScan()">ANALIZAR AHORA</button>
    </div>

    <script>
        const video = document.getElementById('camera-feed');
        const card = document.getElementById('ar-card');
        const riskText = document.getElementById('risk-text');

        // Iniciar cámara
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                video.srcObject = stream;
            } catch (err) {
                alert("Error al acceder a la cámara: " + err);
            }
        }

        function startScan() {
            // Animación de escaneo
            card.classList.remove('visible');
            const btn = document.querySelector('.btn-scan');
            btn.innerText = "ESCANEANDO...";
            btn.style.background = "#95a5a6";

            // Simulación de respuesta de Llama-4 a través de la lógica de negocio
            setTimeout(() => {
                riskText.innerHTML = "<b>PELIGRO:</b> Contiene Harina de Trigo.<br>Riesgo de contaminación cruzada.";
                card.classList.add('visible');
                btn.innerText = "RE-ESCANEAR";
                btn.style.background = "#2ecc71";
            }, 2000);
        }

        initCamera();
    </script>
</body>
</html>
