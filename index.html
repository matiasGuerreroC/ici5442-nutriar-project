<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NutriAR Real-AR</title>
    <!-- Librerías -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        :root {
            --bg: #07111f;
            --panel: rgba(8, 18, 32, 0.85);
            --accent: #44d19d;
        }
        /* El body DEBE ser transparente para que se vea el video de MindAR detrás */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background: transparent; font-family: sans-serif; 
        }

        a-scene {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background: transparent !important;
        }

        canvas,
        video {
            position: fixed !important;
            inset: 0;
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover;
        }
        
        /* UI Overlay */
        .overlay {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            justify-content: space-between; pointer-events: none; padding: 16px; 
            z-index: 100; /* Aseguramos que la UI esté arriba */
        }

        .top-bar {
            pointer-events: auto; display: flex; justify-content: space-between;
            padding: 12px; border-radius: 18px; background: var(--panel); backdrop-filter: blur(10px);
            color: white;
        }

        .status-pill {
            padding: 8px 12px; border-radius: 999px; font-size: 12px;
            background: rgba(255, 255, 255, 0.1); color: white;
        }
        .status-pill.detected { background: var(--accent); color: #000; font-weight: bold; }

        .scan-frame {
            width: 70vw; height: 40vh; border: 2px dashed rgba(68, 209, 157, 0.5);
            border-radius: 20px; margin: auto;
        }

        #ar-card {
            background: var(--panel); padding: 20px; border-radius: 22px; color: white;
            transform: translateY(150px); opacity: 0; transition: 0.3s; pointer-events: auto;
        }
        #ar-card.visible { transform: translateY(0); opacity: 1; }

        .btn-scan {
            background: linear-gradient(135deg, #44d19d, #2ec4b6);
            color: #000; border: none; padding: 15px; border-radius: 15px;
            font-weight: bold; width: 100%; cursor: pointer;
        }

        /* Ocultar elementos innecesarios de la librería */
        .mindar-ui-scanning { display: none; }
    </style>
</head>
<body>

    <!-- Escena de Realidad Aumentada -->
    <!-- uiScanning: false quita la pantalla de carga de la librería que a veces se queda pegada -->
    <a-scene 
        mindar-image="imageTargetSrc: /static/targets.mind; autoStart: true; uiScanning: false;" 
        embedded 
        color-space="sRGB" 
        renderer="colorManagement: true; physicallyCorrectLights: true; precision: mediump;" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="target-ingredientes" mindar-image-target="targetIndex: 0">
            <a-plane position="0 0 0.1" width="1" height="0.5" color="red" opacity="0.7">
                <a-text id="ar-text-0" value="Detectado" align="center"></a-text>
            </a-plane>
        </a-entity>
    </a-scene>

    <!-- Interfaz de Usuario -->
    <div class="overlay">
        <div class="top-bar">
            <div>
                <strong style="display:block">NutriAR AI</strong>
                <span id="target-info">Buscando etiqueta...</span>
            </div>
            <div id="status-pill" class="status-pill">Escaneando</div>
        </div>

        <div class="scan-frame"></div>

        <div class="bottom-panel">
            <div id="ar-card">
                <h3 id="card-title" style="margin-top:0">Análisis NutriAR</h3>
                <p id="risk-text">Enfoca una etiqueta para comenzar.</p>
                <button class="btn-scan" id="scan-button" onclick="startScan()">ANALIZAR AHORA</button>
            </div>
        </div>
    </div>

    <script>
        const statusPill = document.getElementById('status-pill');
        const targetInfo = document.getElementById('target-info');
        const arCard = document.getElementById('ar-card');
        const riskText = document.getElementById('risk-text');

        // Lógica de detección
        const setupTarget = (id, name) => {
            const el = document.getElementById(id);
            if (!el) {
                console.warn(`No se encontró el target ${id}; se omite su registro.`);
                return;
            }

            el.addEventListener("targetFound", () => {
                statusPill.textContent = "DETECTADO";
                statusPill.classList.add('detected');
                targetInfo.textContent = name;
                arCard.classList.add('visible');
                riskText.textContent = `Se ha detectado la ${name}. Presiona el botón para analizar.`;
            });
            el.addEventListener("targetLost", () => {
                statusPill.textContent = "Escaneando";
                statusPill.classList.remove('detected');
                targetInfo.textContent = "Buscando etiqueta...";
            });
        };

        setupTarget('target-ingredientes', 'Lista de Ingredientes');
        setupTarget('target-tabla', 'Tabla Nutricional');

        const sceneEl = document.querySelector('a-scene');
        sceneEl.addEventListener('loaded', async () => {
            try {
                const mindarSystem = sceneEl.systems['mindar-image-system'];
                if (mindarSystem && !mindarSystem.started) {
                    await mindarSystem.start();
                }
            } catch (err) {
                console.error('No se pudo iniciar MindAR automáticamente:', err);
            }
        });

        async function startScan() {
            const btn = document.getElementById('scan-button');
            btn.disabled = true;
            btn.textContent = "CONSULTANDO A GROQ...";

            try {
                // Capturar el canvas de A-Frame
                const scene = document.querySelector('a-scene');
                const canvas = scene.components.screenshot.getCanvas('perspective');
                
                const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.9));
                const formData = new FormData();
                formData.append('image', blob, 'capture.jpg');

                const response = await fetch('/api/analyze', { method: 'POST', body: formData });
                const data = await response.json();
                
                if(data.status === 'success') {
                    riskText.innerHTML = `<b>${data.display.title}:</b> ${data.display.message}`;
                    arCard.style.borderTop = data.display.status === 'ok' ? "5px solid #44d19d" : "5px solid #ff5f6d";
                }
            } catch (err) {
                console.error(err);
                alert("Error en el análisis");
            } finally {
                btn.disabled = false;
                btn.textContent = "RE-ESCANEAR";
            }
        }

        window.addEventListener('camera-error', (error) => {
            alert("Error de cámara: " + error.detail.message);
        });
        window.addEventListener('arReady', (event) => {
            console.log("MindAR está listo");
        });
    </script>
</body>
</html>
