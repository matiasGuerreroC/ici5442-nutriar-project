<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <!-- Usamos versiones específicas y compatibles entre sí -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        .ar-label {
            position: fixed; top: 10%; left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.9);
            color: white; padding: 15px; border-radius: 10px;
            font-family: sans-serif; text-align: center;
            z-index: 9999; display: none; width: 80%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body style="margin: 0px; overflow: hidden;">
    <div id="ui" class="ar-label">
        <b>⚠️ ALERTA NUTRIAR</b><br>
        Contiene: Trigo y Soya<br>
        <small>No apto para tu perfil</small>
    </div>

    <!-- Ajustes: sourceWidth/Height para que no se vea estirado y facingMode environment -->
    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; facingMode: environment;"
        vr-mode-ui="enabled: false">
        
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('ui').style.display = 'block';
            }, 2500);
        });
    </script>
</body>
</html>
