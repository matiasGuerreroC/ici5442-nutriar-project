<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        .ar-label {
            position: fixed; top: 10%; left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.8);
            color: white; padding: 15px;
            border-radius: 10px; font-family: sans-serif;
            text-align: center; z-index: 10; display: none;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">
    <!-- Interfaz de usuario simple sobre la RA -->
    <div id="ui" class="ar-label">
        <b>⚠️ ALERTA NUTRIAR</b><br>
        Contiene: Trigo y Soya<br>
        <small>No apto para tu perfil</small>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // Simulamos que después de 2 segundos de "escanear", aparece la etiqueta
        setTimeout(() => {
            document.getElementById('ui').style.display = 'block';
        }, 2000);
    </script>
</body>
</html>
