<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>NutriAR - Escanear Etiqueta</title>
    
    <!-- LÓGICA BASE: Telegram y CSS Custom -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/static/styles.css">

    <!-- DISEÑO: Tailwind y Fuentes (Del Mockup) -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <!-- Configuración Tailwind del Mockup -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#005f9e",
                        "primary-fixed": "#d1e4ff",
                        "secondary": "#006e28",
                        "secondary-fixed-dim": "#53e16f",
                        "background": "#f9f9f9",
                        "on-surface": "#1a1c1c",
                        "on-surface-variant": "#404751",
                        "surface-bright": "#f9f9f9",
                        "inverse-surface": "#2f3131",
                        "outline-variant": "#c0c7d3"
                    },
                    fontFamily: {
                        body: ["Inter"]
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-background text-on-surface font-body selection:bg-primary-fixed overflow-hidden h-screen w-full flex flex-col">
    
    <!-- Telegram Mini App Header -->
    <header class="w-full top-0 sticky z-50 bg-white dark:bg-[#1a1c1c] border-b border-outline-variant/30">
        <div class="flex items-center justify-between px-4 py-3 w-full">
            <div class="flex items-center gap-3">
                <button class="active:scale-95 transition-transform text-on-surface">
                    <span class="material-symbols-outlined text-[24px]">close</span>
                </button>
                <div class="flex flex-col">
                    <h1 class="font-bold text-[16px] leading-tight text-on-surface">NutriAR</h1>
                    <!-- Aquí inyectamos el ID status-pill antiguo -->
                    <span id="status-pill" class="text-[12px] text-primary font-medium">Iniciando cámara...</span>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-xs font-bold text-primary px-2 py-0.5 bg-primary/10 rounded-full">BETA</span>
                <button class="active:scale-95 transition-transform text-on-surface">
                    <span class="material-symbols-outlined text-[24px]">more_horiz</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area: Camera Viewport -->
    <main class="flex-grow relative overflow-hidden bg-black">
        
        <!-- LO QUE SIRVE: Video de la cámara real en vivo -->
        <video id="camera-feed" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover z-0"></video>

        <!-- Scanning Overlay Layout -->
        <div class="absolute inset-0 z-10 flex flex-col pointer-events-none">
            <!-- Top Shade -->
            <div class="h-[20%] scanner-overlay w-full"></div>
            
            <div class="flex flex-row h-[55%]">
                <div class="w-[8%] scanner-overlay h-full"></div>
                
                <!-- Central Viewfinder Area -->
                <div class="w-[84%] relative">
                    <div class="viewfinder-corner top-0 left-0 border-t-[3px] border-l-[3px] border-white rounded-tl-2xl"></div>
                    <div class="viewfinder-corner top-0 right-0 border-t-[3px] border-r-[3px] border-white rounded-tr-2xl"></div>
                    <div class="viewfinder-corner bottom-0 left-0 border-b-[3px] border-l-[3px] border-white rounded-bl-2xl"></div>
                    <div class="viewfinder-corner bottom-0 right-0 border-b-[3px] border-r-[3px] border-white rounded-br-2xl"></div>
                    
                    <!-- Animated Scan Line -->
                    <div class="scan-line absolute left-2 right-2 h-[2px] bg-primary shadow-[0_0_15px_rgba(0,95,158,0.8)] z-20"></div>
                </div>
                
                <div class="w-[8%] scanner-overlay h-full"></div>
            </div>
            
            <!-- Bottom Shade & Controls -->
            <div class="flex-grow scanner-overlay w-full relative flex flex-col items-center">
                <!-- Instruction Tooltip -->
                <div class="mt-6 pointer-events-auto">
                    <div class="bg-inverse-surface/85 backdrop-blur-md px-5 py-3 rounded-2xl flex items-center gap-3 border border-outline-variant/20 shadow-2xl">
                        <span class="material-symbols-outlined text-surface-bright text-xl">info</span>
                        <p class="text-surface-bright text-[0.875rem] font-semibold tracking-tight leading-none">Enfoca la lista de ingredientes</p>
                    </div>
                </div>
                
                <!-- Interaction Controls -->
                <div class="absolute bottom-10 left-0 right-0 flex justify-center items-center gap-10 px-8 pointer-events-auto">
                    <button class="w-12 h-12 rounded-full bg-black/40 border border-white/20 backdrop-blur-md flex items-center justify-center text-white active:scale-90 transition-all">
                        <span class="material-symbols-outlined text-[24px]">flashlight_on</span>
                    </button>
                    
                    <!-- LO QUE SIRVE: Botón conectado a onclick="startScan()" -->
                    <div class="relative group">
                        <div class="absolute -inset-2 border-2 border-white/30 rounded-full"></div>
                        <button id="scan-button" onclick="startScan()" class="relative w-20 h-20 rounded-full border-4 border-white bg-white/20 backdrop-blur-sm flex items-center justify-center p-1.5 active:scale-95 transition-all shadow-2xl">
                            <div class="w-full h-full rounded-full bg-white flex items-center justify-center">
                                <span class="material-symbols-outlined text-primary text-[32px]">photo_camera</span>
                            </div>
                        </button>
                    </div>

                    <button class="w-12 h-12 rounded-full bg-black/40 border border-white/20 backdrop-blur-md flex items-center justify-center text-white active:scale-90 transition-all">
                        <span class="material-symbols-outlined text-[24px]">image</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- LO QUE FALTABA INTEGRAR: ESTADO DE CARGA DINÁMICO -->
        <div id="loading-text" class="loading-state absolute top-[45%] left-1/2 -translate-x-1/2 z-30">
            <div class="bg-primary/90 backdrop-blur-lg px-4 py-1.5 rounded-full border border-white/30 shadow-lg flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-white animate-pulse"></span>
                <span class="text-white text-[0.625rem] font-black uppercase tracking-[0.15em]">Detectando texto...</span>
            </div>
        </div>

        <!-- LO QUE FALTABA INTEGRAR: TARJETA DE RESULTADO AR -->
        <div id="ar-card" class="result-card absolute bottom-[18px] left-4 right-4 bg-white/95 dark:bg-[#1a1c1c]/95 backdrop-blur-xl p-5 rounded-3xl border border-outline-variant/30 shadow-2xl z-40">
            <div class="flex justify-between items-start mb-2">
                <h2 id="card-title" class="font-bold text-xl text-on-surface leading-tight">Resultado</h2>
                <span id="card-badge" class="px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider bg-gray-200 text-gray-700">Listo</span>
            </div>
            <p id="risk-text" class="text-sm text-on-surface-variant mb-4 font-medium leading-snug">Presiona el botón de cámara para analizar la etiqueta.</p>
            
            <div class="bg-primary/5 rounded-xl p-3 mb-4 flex items-center gap-2">
                <span class="material-symbols-outlined text-primary text-sm">person</span>
                <p id="meta-text" class="text-xs text-primary font-semibold">Perfil activo: Cargando...</p>
            </div>

            <button onclick="restartScan()" class="w-full py-3.5 rounded-2xl bg-primary text-white font-bold tracking-wide active:scale-95 transition-transform flex justify-center items-center gap-2 shadow-lg shadow-primary/30">
                <span class="material-symbols-outlined text-[20px]">refresh</span> Re-escanear
            </button>
        </div>

    </main>

    <!-- BottomNavBar -->
    <nav class="w-full z-50 bg-[#f9f9f9] dark:bg-[#1a1c1c] border-t border-outline-variant/20 shadow-[0_-4px_24px_rgba(0,0,0,0.05)]">
        <div class="flex justify-around items-center h-16 px-4 pb-safe w-full">
            <button class="flex flex-col items-center justify-center text-primary font-bold px-4 py-1">
                <span class="material-symbols-outlined text-[26px]" style="font-variation-settings: 'FILL' 1;">view_in_ar</span>
                <span class="text-[10px] font-bold tracking-wider uppercase mt-0.5">Scanner</span>
            </button>
            <button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors px-4 py-1">
                <span class="material-symbols-outlined text-[26px]">history</span>
                <span class="text-[10px] font-bold tracking-wider uppercase mt-0.5">Historial</span>
            </button>
            <button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors px-4 py-1">
                <span class="material-symbols-outlined text-[26px]">person</span>
                <span class="text-[10px] font-bold tracking-wider uppercase mt-0.5">Perfil</span>
            </button>
        </div>
    </nav>

    <!-- LO QUE SIRVE: Canvas oculto y archivo JavaScript -->
    <canvas id="capture-canvas" class="hidden"></canvas>
    <script src="/static/app.js"></script>
</body>
</html>
