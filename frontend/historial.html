<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Historial NutriAR</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
                "surface": "#f9f9f9", "tertiary-container": "#e2241f", "surface-dim": "#dadada",
                "on-secondary-container": "#00732a", "on-surface": "#1a1c1c", "surface-variant": "#e2e2e2",
                "tertiary-fixed-dim": "#ffb4aa", "surface-container-lowest": "#ffffff", "on-primary-fixed": "#001d35",
                "outline-variant": "#c0c7d3", "surface-tint": "#0062a1", "surface-container": "#eeeeee",
                "on-secondary-fixed-variant": "#00531c", "on-secondary": "#ffffff", "background": "#f9f9f9",
                "on-secondary-fixed": "#002107", "surface-bright": "#f9f9f9", "secondary-fixed": "#72fe88",
                "on-surface-variant": "#404751", "on-primary-container": "#fdfcff", "on-background": "#1a1c1c",
                "error-container": "#ffdad6", "surface-container-high": "#e8e8e8", "on-primary-fixed-variant": "#00497b",
                "error": "#ba1a1a", "inverse-on-surface": "#f1f1f1", "on-tertiary-container": "#fffbff",
                "on-error-container": "#93000a", "secondary": "#006e28", "inverse-primary": "#9dcaff",
                "primary-fixed": "#d1e4ff", "secondary-container": "#6ffb85", "outline": "#707882",
                "on-tertiary-fixed-variant": "#930005", "surface-container-low": "#f3f3f3", "secondary-fixed-dim": "#53e16f",
                "on-error": "#ffffff", "primary-container": "#1278c3", "tertiary-fixed": "#ffdad5",
                "primary": "#005f9e", "surface-container-highest": "#e2e2e2", "primary-fixed-dim": "#9dcaff",
                "on-primary": "#ffffff", "inverse-surface": "#2f3131", "on-tertiary-fixed": "#410001",
                "tertiary": "#bc000a", "on-tertiary": "#ffffff"
            },
            fontFamily: { body: ["Inter"] }
          }
        }
      }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>

<body class="bg-surface text-on-surface min-h-screen pb-24">
    
    <header class="w-full sticky top-0 bg-[#f9f9f9] dark:bg-[#1a1c1c] z-50">
        <div class="flex items-center justify-between px-4 h-14 w-full">
            <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-[#005f9e] dark:text-[#4dabf7]">search</span>
                <h1 class="font-['Inter'] font-semibold tracking-tight text-lg text-[#1a1c1c] dark:text-[#f9f9f9]">Historial</h1>
            </div>
        </div>
        <div class="bg-[#f3f3f3] dark:bg-[#2f3131] h-[1px] w-full"></div>
    </header>

    <main class="px-4 pt-4 max-w-md mx-auto">
        
        <div class="mb-6">
            <div class="relative flex items-center bg-surface-container-low rounded-xl px-4 py-3 focus-within:ring-2 focus-within:ring-primary/20 transition-all">
                <span class="material-symbols-outlined text-outline mr-3">search</span>
                <input class="bg-transparent border-none focus:ring-0 w-full text-body-lg placeholder:text-outline/70 outline-none" placeholder="Buscar productos escaneados..." type="text"/>
            </div>
        </div>

        <section class="mb-6">
            <div class="flex items-baseline justify-between mb-3 px-1">
                <h2 class="font-bold text-sm tracking-widest uppercase text-on-surface-variant/60">Últimos Análisis</h2>
            </div>
            
            <!-- EL JAVASCRIPT INYECTARÁ LOS PRODUCTOS AQUÍ ADENTRO -->
            <div id="historial-container" class="space-y-3">
                <div class="text-center text-outline mt-10">Cargando historial...</div>
            </div>
            
        </section>

        <!-- Bento-style Statistics Card -->
        <section class="mb-8">
            <div class="bg-primary text-white rounded-2xl p-5 shadow-lg relative overflow-hidden">
                <div class="relative z-10">
                    <h4 class="text-xs font-bold uppercase tracking-[0.2em] opacity-80 mb-1">Resumen Semanal</h4>
                    <p class="text-2xl font-extrabold tracking-tight"><span id="total-productos">0</span> Productos</p>
                    <div class="mt-4 flex gap-4">
                        <div class="bg-white/10 backdrop-blur-md rounded-lg p-2 flex-1">
                            <p class="text-[10px] font-medium opacity-70">APTOS</p>
                            <p id="total-aptos" class="text-lg font-bold">0</p>
                        </div>
                        <div class="bg-white/10 backdrop-blur-md rounded-lg p-2 flex-1">
                            <p class="text-[10px] font-medium opacity-70">NO APTOS</p>
                            <p id="total-no-aptos" class="text-lg font-bold">0</p>
                        </div>
                    </div>
                </div>
                <div class="absolute -right-4 -bottom-4 opacity-20">
                    <span class="material-symbols-outlined text-[120px]" style="font-variation-settings: 'wght' 700;">history</span>
                </div>
            </div>
        </section>
    </main>

    <!-- BottomNavBar -->
    <nav class="fixed bottom-0 left-0 w-full z-50 bg-[#f9f9f9] shadow-[0_-4px_24px_rgba(0,0,0,0.05)] border-t border-outline-variant/20">
        <div class="flex justify-around items-center h-16 px-4 pb-2 w-full">
            <button onclick="goToScanner()" class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors px-4 py-1 active:scale-95">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">barcode_scanner</span>
                <span class="text-[10px] font-bold tracking-wider uppercase mt-0.5">Escanear</span>
            </button>
            <button onclick="goToHistory()" class="flex flex-col items-center justify-center text-primary font-bold px-4 py-1 active:scale-95">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">history</span>
                <span class="text-[10px] font-bold tracking-wider uppercase mt-0.5">Historial</span>
            </button>
            <button onclick="goToPerfil()" class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors px-4 py-1 active:scale-95">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
                <span class="text-[10px] font-bold tracking-wider uppercase mt-0.5">Perfil</span>
            </button>
        </div>
    </nav>

    <!-- LÓGICA DEL HISTORIAL -->
    <script>
        const apiBaseUrl = window.location.origin;
        const urlParams = new URLSearchParams(window.location.search);
        let telegramId = urlParams.get('telegram_id');

        document.addEventListener('DOMContentLoaded', async () => {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
                if (!telegramId) {
                    telegramId = window.Telegram.WebApp.initDataUnsafe?.user?.id || '';
                }
            }

            if (telegramId) {
                const isConfigured = await checkProfileConfiguration();
                if (isConfigured) {
                    await cargarHistorial();
                }
            } else {
                document.getElementById('historial-container').innerHTML = 
                    `<div class="text-center text-outline mt-10">⚠️ Abre esta app desde Telegram para ver tu historial.</div>`;
            }
        });

        function goToScanner() {
            if (telegramId) {
                window.location.href = '/?telegram_id=' + telegramId;
            } else {
                window.location.href = '/';
            }
        }

        function goToPerfil() {
            if (telegramId) {
                window.location.href = '/perfil?telegram_id=' + telegramId;
            } else {
                window.location.href = '/perfil';
            }
        }

        async function cargarHistorial() {
            try {
                const response = await fetch(`${apiBaseUrl}/api/historial/${telegramId}`);
                const data = await response.json();

                if (data.status === 'success') {
                    renderizarHistorial(data.historial, data.total);
                } else {
                    console.error("Error al cargar historial:", data.error);
                }
            } catch (err) {
                console.error("Error de red:", err);
            }
        }

        async function editarNombre(historialId, nombreCodificado) {
            const nombreActual = decodeURIComponent(nombreCodificado || '');
            const nuevoNombre = prompt('Editar nombre del producto:', nombreActual);

            if (nuevoNombre === null) return;
            if (!nuevoNombre.trim()) {
                alert('El nombre no puede estar vacío.');
                return;
            }

            try {
                const response = await fetch(`${apiBaseUrl}/api/historial/${telegramId}/${historialId}/nombre`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ desc_breve_producto: nuevoNombre.trim() })
                });
                const data = await response.json();

                if (data.status !== 'success') {
                    throw new Error(data.error || 'No se pudo actualizar el nombre.');
                }

                await cargarHistorial();
            } catch (err) {
                console.error('Error actualizando nombre:', err);
                alert(err.message || 'Error al actualizar el nombre.');
            }
        }

        async function eliminarRegistro(historialId) {
            const confirmado = confirm('¿Eliminar este registro del historial? Esta acción no se puede deshacer.');
            if (!confirmado) return;

            try {
                const response = await fetch(`${apiBaseUrl}/api/historial/${telegramId}/${historialId}`, {
                    method: 'DELETE'
                });
                const data = await response.json();

                if (data.status !== 'success') {
                    throw new Error(data.error || 'No se pudo eliminar el registro.');
                }

                await cargarHistorial();
            } catch (err) {
                console.error('Error eliminando registro:', err);
                alert(err.message || 'Error al eliminar el registro.');
            }
        }

        function renderizarHistorial(historial, total) {
            // Actualizar la tarjeta de Resumen (Bento Box)
            document.getElementById('total-productos').textContent = total;
            
            const aptos = historial.filter(item => item.es_apto).length;
            const noAptos = total - aptos;
            
            document.getElementById('total-aptos').textContent = aptos;
            document.getElementById('total-no-aptos').textContent = noAptos;

            const container = document.getElementById('historial-container');
            container.innerHTML = ''; 

            if (historial.length === 0) {
                container.innerHTML = `<div class="text-center text-outline mt-10">📭 Aún no tienes análisis registrados.</div>`;
                return;
            }

            historial.forEach(item => {
                const date = new Date(item.fecha_hora_escaneo);
                const dateStr = date.toLocaleDateString([], { day: '2-digit', month: 'short' });

                // Crear los chips de riesgo si no es apto
                let chipsHtml = '';
                if (!item.es_apto && item.ingredientes_peligrosos.length > 0) {
                    chipsHtml = `<span class="text-xs text-tertiary font-semibold flex items-center gap-1 truncate max-w-[200px]">
                                    <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">warning</span>
                                    ${item.ingredientes_peligrosos.join(', ')}
                                 </span>`;
                }

                // Generar el HTML de la tarjeta
                const imageHtml = item.imagen_base64
                    ? `<div class="w-20 h-20 rounded-2xl overflow-hidden flex-shrink-0 bg-surface-container border border-surface-container-high">
                            <img src="${item.imagen_base64}" alt="Escaneo" class="w-full h-full object-cover">
                       </div>`
                    : `<div class="w-20 h-20 rounded-2xl overflow-hidden flex-shrink-0 bg-surface-container border border-surface-container-high flex items-center justify-center">
                            <span class="material-symbols-outlined text-outline/40 text-3xl">image_not_supported</span>
                       </div>`;

                const cardHtml = `
                <div class="bg-surface-container-lowest rounded-xl p-3 flex gap-4 items-center shadow-sm mb-3">
                    ${imageHtml}
                    <div class="flex-grow min-w-0">
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold text-on-surface truncate text-sm">${item.desc_breve_producto}</h3>
                            <span class="text-[10px] text-outline font-medium whitespace-nowrap ml-2">${dateStr}</span>
                        </div>
                        <div class="mt-1 flex items-center gap-2 overflow-hidden">
                            ${item.es_apto 
                                ? `<span class="inline-flex items-center px-2 py-0.5 rounded-full bg-secondary-container text-on-secondary-container text-[10px] font-bold uppercase tracking-wider shrink-0">Apto</span>` 
                                : `<span class="inline-flex items-center px-2 py-0.5 rounded-full bg-error-container text-on-error-container text-[10px] font-bold uppercase tracking-wider shrink-0">No Apto</span>`
                            }
                            ${chipsHtml}
                        </div>
                        <div class="mt-2 flex items-center justify-end gap-4">
                            <button onclick="editarNombre(${item.id}, '${encodeURIComponent(item.desc_breve_producto || '')}')" class="inline-flex items-center gap-1 text-[11px] font-semibold text-primary hover:opacity-80 transition-opacity">
                                <span class="material-symbols-outlined text-sm">edit</span>
                                Editar nombre
                            </button>
                            <button onclick="eliminarRegistro(${item.id})" class="inline-flex items-center gap-1 text-[11px] font-semibold text-error hover:opacity-80 transition-opacity">
                                <span class="material-symbols-outlined text-sm">delete</span>
                                Eliminar
                            </button>
                        </div>
                    </div>
                </div>`;
                
                container.innerHTML += cardHtml;
            });
        }
        
        // Verificar si el perfil está configurado (tiene al menos una restricción activa)
        async function checkProfileConfiguration() {
            if (!telegramId) return true; // Permitir si no hay telegramId (modo web)
            
            try {
                const response = await fetch(`${apiBaseUrl}/api/usuario/${telegramId}`);
                const data = await response.json();
                
                if (data.usuario && data.usuario.restricciones && data.usuario.restricciones.length === 0) {
                    // Usuario sin restricciones - perfil no configurado
                    showConfigurationBlockedUI();
                    return false; // No cargar el historial
                }
                
                return true; // Perfil configurado - permitir ver el historial
            } catch (err) {
                console.error('Error verificando configuración del perfil:', err);
                return true; // Por seguridad, permitir si hay error
            }
        }
        
        // Mostrar UI bloqueada cuando el perfil no está configurado
        function showConfigurationBlockedUI() {
            // Bloquear la pantalla principal
            const main = document.querySelector('main');
            if (main) {
                main.style.opacity = '0.3';
                main.style.pointerEvents = 'none';
            }
            
            // Bloquear la navbar inferior también
            const nav = document.querySelector('nav');
            if (nav) {
                nav.style.opacity = '0.3';
                nav.style.pointerEvents = 'none';
            }
            
            // Crear overlay con mensaje
            const overlay = document.createElement('div');
            overlay.id = 'config-blocked-overlay';
            overlay.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.7);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                z-index: 9999;
            `;
            
            const messageBox = document.createElement('div');
            messageBox.style.cssText = `
                background: white;
                border-radius: 20px;
                padding: 24px;
                max-width: 280px;
                text-align: center;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            `;
            
            messageBox.innerHTML = `
                <span class="material-symbols-outlined" style="font-size: 48px; color: #005f9e; margin-bottom: 12px; display: block; font-variation-settings: 'FILL' 1;">settings</span>
                <h2 style="font-size: 18px; font-weight: 700; color: #1a1c1c; margin-bottom: 8px;">Configuración Pendiente</h2>
                <p style="font-size: 14px; color: #404751; margin-bottom: 20px; line-height: 1.5;">Primero debes terminar de configurar tu perfil para usar esta opción.</p>
                <button onclick="goToPerfil()" style="
                    width: 100%;
                    padding: 12px;
                    background: #005f9e;
                    color: white;
                    border: none;
                    border-radius: 12px;
                    font-weight: 600;
                    font-size: 14px;
                    cursor: pointer;
                    transition: background 0.3s;
                " onmouseover="this.style.background='#004080'" onmouseout="this.style.background='#005f9e'">
                    Ir al Perfil
                </button>
            `;
            
            overlay.appendChild(messageBox);
            document.body.appendChild(overlay);
        }
    </script>
</body>
</html>
